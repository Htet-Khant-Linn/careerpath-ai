<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CareerPath AI — Learning Roadmap</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700&family=DM+Mono&family=DM+Sans&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'DM Sans', sans-serif; background: #f5f0e8; color: #0d0d0d; padding: 24px; }
  .wrap { max-width: 800px; margin: 0 auto; }
  h1 { font-family: 'Syne', sans-serif; margin-bottom: 24px; }
  .card { background: #fff; padding: 24px; border: 2px solid #0d0d0d; border-radius: 4px; margin-bottom: 24px; box-shadow: 4px 4px 0 #0d0d0d; }
  select, input, button { width: 100%; padding: 12px; margin-top: 8px; margin-bottom: 16px; border: 2px solid #c8c0b0; border-radius: 4px; font-family: inherit; }
  button { background: #0d0d0d; color: #fff; font-weight: bold; cursor: pointer; border: 2px solid #0d0d0d; }
  button:hover { background: #d4501a; border-color: #d4501a; }
  #result, #loading { display: none; }
  .error { color: red; font-weight: bold; margin-bottom: 16px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>CareerPath AI</h1>
  
  <div class="card" id="form-card">
    <label>Career Path:</label>
    <select id="career">
      <option value="1">Software Developer / Engineer</option>
      <option value="2">AI / Machine Learning Engineer</option>
      <option value="3">Data Scientist</option>
      <option value="4">Cybersecurity Analyst / Engineer</option>
      <option value="5">Cloud Architect</option>
      <option value="6">DevOps Engineer</option>
      <option value="7">Data Engineer</option>
      <option value="8">Web Developer</option>
      <option value="9">Computer Systems Analyst</option>
      <option value="10">Software Architect</option>
    </select>

    <label>Skill Level:</label>
    <select id="level">
      <option value="beginner">Beginner</option>
      <option value="intermediate">Intermediate</option>
      <option value="advanced">Advanced</option>
    </select>

    <label>Available Time (e.g., 6 months, 10 hours per week):</label>
    <input type="text" id="time" placeholder="e.g. 6 months" />

    <div id="error-msg" class="error"></div>
    <button onclick="generateRoadmap()">Generate Roadmap</button>
  </div>

  <div class="card" id="loading">
    <h3>Building your roadmap... Please wait.</h3>
  </div>

  <div class="card" id="result">
    <div id="roadmap-content"></div>
    <button onclick="reset()">Start Over</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
<script>
  // Ensure there is NO slash at the end of this URL
  const BACKEND_URL = "https://careerpath-ai-2235411926.us-central1.run.app";

  async function generateRoadmap() {
    const career = document.getElementById("career").value;
    const level = document.getElementById("level").value;
    const time = document.getElementById("time").value.trim();
    const err = document.getElementById("error-msg");

    if (!time) {
      err.textContent = "Please enter your available time.";
      return;
    }

    err.textContent = "";
    document.getElementById("form-card").style.display = "none";
    document.getElementById("loading").style.display = "block";

    try {
      const response = await fetch(`${BACKEND_URL}/generate`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ career_choice: career, level: level, time_input: time })
      });

      const data = await response.json();

      if (!response.ok) throw new Error(data.error || "Server error");

      document.getElementById("loading").style.display = "none";
      document.getElementById("result").style.display = "block";
      document.getElementById("roadmap-content").innerHTML = marked.parse(data.roadmap);

    } catch (error) {
      document.getElementById("loading").style.display = "none";
      document.getElementById("form-card").style.display = "block";
      err.textContent = error.message;
    }
  }

  function reset() {
    document.getElementById("result").style.display = "none";
    document.getElementById("form-card").style.display = "block";
    document.getElementById("time").value = "";
  }
</script>
</body>
</html>
